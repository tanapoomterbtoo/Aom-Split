<!DOCTYPE html>
<html lang="th">
<head>
  <script src="js/boot.js?v=20260808d"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aom Split — หารค่าเหล้าเพื่อน (Who Owes Whom)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css?v=20260808d" />
</head>
<body>
  <!-- App Header -->
  <header class="app-header">
    <a href="index.html" class="brand">
      <div class="logo">A</div>
      <div>
        <h1>Aom Split</h1>
        <p class="sub">หารเหล้า</p>
      </div>
    </a>
    <div class="spacer"></div>
    <button id="btn-header-new" class="btn btn-primary btn-sm">+ สร้างทริปใหม่</button>
  </header>

  <!-- Main Container -->
  <main class="container">
    <!-- Hero Banner -->
    <section class="hero card" style="margin-top: 0.5rem; margin-bottom: 1rem; border-color: rgba(240, 180, 41, 0.25);">
      <div style="font-size: 2.2rem; margin-bottom: 0.2rem;">🍺</div>
      <h2 style="margin-top: 0;">Aom Split (หารเหล้า)</h2>
      <p style="margin-bottom: 0.75rem; color: var(--muted); font-size: 0.95rem;">
        ใครจ่ายอะไร · ใครกินเท่าไร · ใครโอนใคร
      </p>
      <div class="btn-row" style="justify-content: center;">
        <button id="btn-hero-new" class="btn btn-primary">
          <span style="font-weight: 700;">+ สร้างทริปใหม่</span>
        </button>
      </div>
    </section>

    <!-- Persistence notice + backup -->
    <div id="save-banner" class="save-banner">
      <div class="icon">💾</div>
      <div class="body">
        <div class="title">บันทึกอัตโนมัติบนเครื่องนี้</div>
        <div class="desc" id="save-banner-desc">
          ทริป รายการจ่าย และสรุปโอนถูกเก็บในเบราว์เซอร์ — เปิดกลับมาเมื่อไหร่ก็เจอข้อมูลเดิม
        </div>
        <div class="backup-row">
          <button type="button" id="btn-export" class="btn btn-sm btn-ghost">⬇️ ส่งออกสำรอง</button>
          <button type="button" id="btn-import" class="btn btn-sm btn-ghost">⬆️ นำเข้าสำรอง</button>
          <input type="file" id="input-import" accept="application/json,.json" hidden />
        </div>
      </div>
    </div>

    <!-- Session List Section -->
    <section>
      <div class="card-h" style="padding: 0 0.25rem;">
        <h2 style="display: flex; align-items: center; gap: 0.5rem;">
          <span>รายการทริปของคุณ</span>
          <span id="session-count-badge" class="badge">0</span>
        </h2>
      </div>

      <div id="session-list">
        <!-- Rendered dynamically -->
      </div>
    </section>
  </main>

  <!-- Modal: สร้างทริปใหม่ -->
  <div id="modal-create" class="modal-backdrop">
    <div class="modal">
      <div class="card-h">
        <h3>🍻 สร้างทริปใหม่</h3>
        <button type="button" id="btn-modal-close" class="btn btn-ghost btn-sm" style="font-size: 1.2rem; padding: 0.2rem 0.5rem;">✕</button>
      </div>
      <form id="form-create-session" onsubmit="return false;">
        <div class="field">
          <label for="input-title">ชื่อทริป / ร้าน</label>
          <input type="text" id="input-title" class="input" placeholder="เช่น คืนนี้สุขุมวิท, ร้านลอยชาย" required />
        </div>
        <div class="field">
          <label for="input-members">สมาชิกในกลุ่ม (1 ชื่อต่อบรรทัด)</label>
          <textarea id="input-members" rows="4" class="input" placeholder="ชื่อเพื่อน 1 คนต่อบรรทัด"></textarea>
          <span class="muted" style="font-size: 0.78rem; display: block; margin-top: 0.25rem;">
            * สามารถเพิ่มหรือแก้ไขรายชื่อสมาชิกทีหลังในทริปได้
          </span>
        </div>
        <div style="margin-top: 1.25rem; display: flex; flex-direction: column; gap: 0.5rem;">
          <button type="submit" id="btn-create-submit" class="btn btn-primary btn-block">สร้างทริปและเริ่มหาร</button>
          <button type="button" id="btn-modal-cancel" class="btn btn-ghost btn-block">ยกเลิก</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts in required order -->
  <script src="js/money.js?v=20260808d"></script>
  <script src="js/store.js?v=20260808d"></script>
  <script src="js/ui.js?v=20260808d"></script>
  <script>
    (function () {
      const modalEl = document.getElementById("modal-create");
      const titleInput = document.getElementById("input-title");
      const membersInput = document.getElementById("input-members");

      function formatWhen(ts) {
        if (!ts) return "—";
        try {
          return new Date(ts).toLocaleString("th-TH", {
            dateStyle: "medium",
            timeStyle: "short",
          });
        } catch (e) {
          return String(ts);
        }
      }

      function refreshSaveBanner() {
        const banner = document.getElementById("save-banner");
        const desc = document.getElementById("save-banner-desc");
        if (!banner || !desc) return;
        const info = AomStore.storageInfo();
        if (!info.available) {
          banner.classList.add("warn");
          desc.textContent =
            "เบราว์เซอร์นี้บันทึกไม่ได้ (อาจเป็นโหมดส่วนตัว) — ข้อมูลจะหายเมื่อปิดแท็บ";
          return;
        }
        banner.classList.remove("warn");
        desc.innerHTML =
          "ทริปและรายการถูกเก็บในเบราว์เซอร์เครื่องนี้ · " +
          info.sessionCount +
          " ทริป · บันทึกล่าสุด " +
          formatWhen(info.savedAt) +
          "<br/><span style=\"opacity:0.9\">ใช้เครื่อง/เบราว์เซอร์เดิมจะเจอข้อมูลเดิม · อยากย้ายเครื่องให้ส่งออกสำรอง</span>";
      }

      function openModal() {
        titleInput.value = "";
        membersInput.value = "";
        modalEl.classList.add("show");
        titleInput.focus();
      }

      function closeModal() {
        modalEl.classList.remove("show");
      }

      function handleCreateSession(e) {
        if (e) e.preventDefault();
        const title = titleInput.value.trim() || "ทริปกินเหล้า";
        const rawMembers = membersInput.value;
        const names = rawMembers
          .split(/[\n,]/)
          .map(function (s) { return s.trim(); })
          .filter(Boolean);

        if (names.length === 0) {
          if (typeof AomUI !== "undefined" && AomUI.toast) {
            AomUI.toast("กรุณาใส่ชื่อสมาชิกอย่างน้อย 1 คน");
          } else {
            alert("กรุณาใส่ชื่อสมาชิกอย่างน้อย 1 คน");
          }
          return;
        }

        try {
          const session = AomStore.createSession(title, names);
          closeModal();
          AomUI.go("session.html", { id: session.id });
        } catch (err) {
          AomUI.toast((err && err.message) || "บันทึกไม่สำเร็จ");
        }
      }

      function handleDeleteSession(e, id, title) {
        e.stopPropagation();
        if (confirm('คุณต้องการลบทริป "' + title + '" ใช่หรือไม่?')) {
          AomStore.deleteSession(id);
          if (typeof AomUI !== "undefined" && AomUI.toast) {
            AomUI.toast("ลบทริปเรียบร้อย");
          }
          render();
        }
      }

      function render() {
        const sessions = AomStore.listSessions();
        const listContainer = document.getElementById("session-list");
        const countBadge = document.getElementById("session-count-badge");

        countBadge.textContent = sessions.length;

        if (sessions.length === 0) {
          listContainer.innerHTML = `
            <div class="card empty">
              <div style="font-size:2.5rem; margin-bottom: 0.5rem;">🍻</div>
              <div style="font-weight:700; font-size:1.1rem; color:var(--text); margin-bottom:0.25rem;">ยังไม่มีทริป</div>
              <p style="margin-bottom: 1rem;">เริ่มสร้างทริปใหม่ แล้วเพิ่มเพื่อนในกลุ่ม</p>
              <div class="btn-row" style="justify-content:center;">
                <button class="btn btn-primary btn-sm btn-create-trigger">+ สร้างทริปแรก</button>
              </div>
            </div>
          `;
          listContainer.querySelectorAll(".btn-create-trigger").forEach(function (btn) {
            btn.addEventListener("click", openModal);
          });
          return;
        }

        let html = "";
        sessions.forEach(function (s) {
          const members = s.members || [];
          const activeExpenses = (s.expenses || []).filter(function (e) { return !e.deleted; });
          const totalSpentMinor = activeExpenses.reduce(function (sum, e) {
            return sum + (AomMoney.satang(e.amountMinor) || 0);
          }, 0);
          const formattedSpent = AomMoney.formatMoney(totalSpentMinor);

          const memberAvatars = members.slice(0, 4).map(function (m) {
            return AomUI.avatar(s, m.id, 24);
          }).join("");

          const extraMemberCount = members.length > 4 ? '<span class="muted" style="font-size:0.75rem; margin-left:0.25rem;">+' + (members.length - 4) + '</span>' : '';

          const dateStr = s.date || (s.createdAt ? new Date(s.createdAt).toISOString().slice(0, 10) : "");

          html += `
            <div class="card session-card" data-id="${s.id}" style="cursor:pointer; transition: transform 0.1s ease, border-color 0.15s ease;">
              <div class="card-h" style="margin-bottom: 0.4rem;">
                <div style="min-width:0; flex:1;">
                  <div class="title" style="font-size:1.05rem; font-weight:700; color:var(--text); text-overflow:ellipsis; overflow:hidden; white-space:nowrap;">
                    🍺 ${escapeHtml(s.title || "ทริปกินเหล้า")}
                  </div>
                  <div class="meta" style="font-size:0.82rem; color:var(--muted); margin-top:0.2rem; display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
                    <span>📅 ${escapeHtml(dateStr)}</span>
                    <span>•</span>
                    <span>👥 ${members.length} คน</span>
                    <span>•</span>
                    <span>🧾 ${activeExpenses.length} รายการ</span>
                  </div>
                </div>
                <div style="text-align:right; flex-shrink:0;">
                  <div class="money big" style="font-size:1.15rem;">${formattedSpent}</div>
                </div>
              </div>

              <div style="display:flex; align-items:center; justify-content:space-between; margin-top:0.65rem; border-top:1px dashed var(--border); padding-top:0.55rem;">
                <div style="display:flex; align-items:center; gap:0.3rem; min-width:0; flex:1; overflow:hidden;">
                  <div style="display:flex; align-items:center; margin-right:0.25rem; flex-shrink:0;">${memberAvatars}${extraMemberCount}</div>
                  <span class="muted" style="font-size:0.8rem; text-overflow:ellipsis; overflow:hidden; white-space:nowrap;">${escapeHtml(members.map(function (m) { return m.displayName; }).join(", "))}</span>
                </div>
                <button type="button" class="btn btn-danger btn-sm btn-delete-session" data-id="${s.id}" data-title="${escapeHtml(s.title || '')}" title="ลบทริป" style="padding:0.25rem 0.55rem; font-size:0.8rem; flex-shrink:0; margin-left:0.5rem;">
                  🗑️ ลบ
                </button>
              </div>
            </div>
          `;
        });

        listContainer.innerHTML = html;

        // Attach event listeners
        listContainer.querySelectorAll(".session-card").forEach(function (card) {
          card.addEventListener("click", function (e) {
            if (e.target.closest(".btn-delete-session")) return;
            const id = card.getAttribute("data-id");
            AomUI.go("session.html", { id: id });
          });
        });

        listContainer.querySelectorAll(".btn-delete-session").forEach(function (btn) {
          btn.addEventListener("click", function (e) {
            const id = btn.getAttribute("data-id");
            const title = btn.getAttribute("data-title");
            handleDeleteSession(e, id, title);
          });
        });
      }

      function escapeHtml(str) {
        if (!str) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      // Event Listeners
      document.getElementById("btn-header-new").addEventListener("click", openModal);
      document.getElementById("btn-hero-new").addEventListener("click", openModal);
      document.getElementById("btn-modal-close").addEventListener("click", closeModal);
      document.getElementById("btn-modal-cancel").addEventListener("click", closeModal);
      document.getElementById("form-create-session").addEventListener("submit", handleCreateSession);

      document.getElementById("btn-export").addEventListener("click", function () {
        try {
          AomStore.downloadBackup();
          AomUI.toast("ส่งออกไฟล์สำรองแล้ว");
        } catch (err) {
          AomUI.toast((err && err.message) || "ส่งออกไม่สำเร็จ");
        }
      });

      document.getElementById("btn-import").addEventListener("click", function () {
        document.getElementById("input-import").click();
      });

      document.getElementById("input-import").addEventListener("change", function (e) {
        const file = e.target.files && e.target.files[0];
        e.target.value = "";
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function () {
          try {
            const n = AomStore.importData(String(reader.result || ""), "merge");
            AomUI.toast("นำเข้าสำเร็จ · รวม " + n + " ทริป");
            refreshSaveBanner();
            render();
          } catch (err) {
            AomUI.toast((err && err.message) || "นำเข้าไม่สำเร็จ");
          }
        };
        reader.onerror = function () {
          AomUI.toast("อ่านไฟล์ไม่สำเร็จ");
        };
        reader.readAsText(file, "utf-8");
      });

      modalEl.addEventListener("click", function (e) {
        if (e.target === modalEl) closeModal();
      });

      window.addEventListener("aom-split-saved", function () {
        refreshSaveBanner();
      });

      // Initial render
      refreshSaveBanner();
      render();
    })();
  </script>
</body>
</html>
