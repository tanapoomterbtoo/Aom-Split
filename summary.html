<!DOCTYPE html>
<html lang="th">
<head>
  <script src="js/boot.js?v=20260811ux"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aom Split — กำลังเปิดสรุปโอน…</title>
  <link rel="stylesheet" href="css/app.css?v=20260811ux" />
  <meta name="robots" content="noindex" />
</head>
<body>
  <main class="container" style="padding-top:2rem;">
    <div class="card empty" id="msg">
      <div style="font-size:1.6rem;margin-bottom:0.5rem;">⚡</div>
      <div style="font-weight:700;">กำลังเปิดสรุปโอน…</div>
      <p class="muted" style="margin-top:0.5rem;">อยู่ในแท็บสรุปโอนของทริป</p>
    </div>
  </main>
  <script src="js/ui.js?v=20260811ux"></script>
  <script>
    (function () {
      var id = AomUI.getQuery("id");
      if (!id) {
        document.getElementById("msg").innerHTML =
          '<div style="font-weight:700;margin-bottom:0.5rem;">ไม่พบรหัสทริป</div>' +
          '<a class="btn btn-primary" href="index.html">กลับหน้าแรก</a>';
        return;
      }
      // Redirect into in-page summary tab (fixes bounce on multi-page nav)
      AomUI.go("session.html", { id: id, tab: "summary" });
    })();
  </script>
</body>
</html>
